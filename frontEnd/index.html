<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoadGuard AI - محاكاة رصد شارع المطار عمان</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts: Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
            background-color: #0f172a;
            color: #1e293b;
        }

        #map {
            height: 100vh;
            width: 100vw;
            z-index: 1;
        }

        /* Glassmorphism Side Panel */
        .dashboard-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 22px 24px;
            border-radius: 18px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.16), 0 2px 6px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.7);
            width: 360px;
            max-width: calc(100vw - 40px);
            direction: rtl;
            transition: all 0.3s ease;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #eff6ff;
            color: #1d4ed8;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            margin-bottom: 8px;
            border: 1px solid #dbeafe;
        }

        .panel-title {
            margin: 0 0 14px 0;
            font-size: 1.25rem;
            font-weight: 800;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .road-indicator {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 10px 12px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
        }

        .stat-card.full {
            grid-column: span 2;
        }

        .stat-label {
            font-size: 0.78rem;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.05rem;
            font-weight: 700;
            color: #0f172a;
        }

        .slider-section {
            margin: 16px 0;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 6px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 7px;
            border-radius: 6px;
            background: #e2e8f0;
            outline: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #2563eb;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
            border: 2px solid #ffffff;
            transition: transform 0.15s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .controls-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .btn-main {
            flex: 1;
            padding: 11px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-main:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            transform: translateY(-1px);
        }

        .btn-sec {
            padding: 11px 16px;
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-sec:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        .pothole-badge {
            margin-top: 10px;
            background: #fffbeb;
            border: 1px solid #fef3c7;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            color: #b45309;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Leaflet Marker Styling */
        .car-marker-container {
            position: relative;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .car-pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(37, 99, 235, 0.35);
            animation: pulse-ring 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        .car-icon-body {
            position: relative;
            background: #ffffff;
            border: 2px solid #2563eb;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: transform 0.1s linear;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.6); opacity: 1; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        .pothole-icon-wrapper {
            background: #dc2626;
            color: white;
            border: 2px solid #ffffff;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            box-shadow: 0 3px 8px rgba(220, 38, 38, 0.4);
            cursor: pointer;
        }

        /* Custom Popup */
        .leaflet-popup-content-wrapper {
            border-radius: 14px;
            padding: 4px;
            font-family: 'Cairo', sans-serif;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .popup-card {
            padding: 6px;
            direction: rtl;
        }

        .popup-badge {
            display: inline-block;
            background: #fee2e2;
            color: #b91c1c;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .popup-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: #0f172a;
            margin-bottom: 4px;
        }

        .popup-desc {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 8px;
        }

        .popup-img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 6px;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px);
            z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: #fff; font-size: 1.2rem; font-weight: 700; gap: 15px;
            transition: opacity 0.5s;
        }
        .spinner {
            width: 45px; height: 45px; border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid #3b82f6; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text">جاري سحب مسار الشارع الفعلي من الأقمار الصناعية...</div>
    </div>

    <div class="dashboard-panel">
        <div class="header-badge">
            <span>●</span> نظام الرصد الذكي RoadGuard
        </div>

        <h2 class="panel-title">
            <span>محاكاة مسار الرصد</span>
            <span style="font-size: 1.1rem;">🚗</span>
        </h2>

        <div class="road-indicator">
            <span>📍</span>
            <span>طريق مطار الملكة علياء الدولي (مقطع قصير)</span>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">الفريم الحالي</span>
                <span class="stat-value" id="frame-val" style="color: #2563eb;">0 / 900</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">الإنجاز</span>
                <span class="stat-value" id="percent-val" style="color: #059669;">0%</span>
            </div>
            <div class="stat-card full">
                <span class="stat-label">المسافة المقطوعة / الكلية</span>
                <span class="stat-value" id="dist-val" style="color: #1e293b;">0 متر / جاري الحساب...</span>
            </div>
        </div>

        <div class="slider-section">
            <div class="slider-header">
                <span>بداية المسار (0)</span>
                <span>نهاية المسار (900)</span>
            </div>
            <!-- Disabled initially -->
            <input type="range" id="frame-slider" min="0" max="900" value="0" disabled>
        </div>

        <div class="controls-row">
            <!-- Disabled initially -->
            <button class="btn-main" id="play-btn" disabled>
                <span id="play-icon">▶️</span>
                <span id="play-text">تشغيل المحاكاة</span>
            </button>
            <button class="btn-sec" id="reset-btn" title="إعادة للبداية" disabled>↺</button>
        </div>

        <div class="pothole-badge">
            <span>حفر مرصودة على الخريطة:</span>
            <strong id="pothole-count" style="font-size: 0.95rem;">0 عوائق</strong>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const totalFrames = 900;
        const slider = document.getElementById('frame-slider');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const playText = document.getElementById('play-text');
        const resetBtn = document.getElementById('reset-btn');
        const frameVal = document.getElementById('frame-val');
        const percentVal = document.getElementById('percent-val');
        const distVal = document.getElementById('dist-val');
        const potholeCountEl = document.getElementById('pothole-count');

        // Dynamic route variables
        let airportRoute = [];
        let cumulativeDistances = [0];
        let totalHighwayDistance = 0;
        let plannedPolyline, traveledPolyline, carMarker;

        // NEW: Shortened Start and End Points based on the provided image
        // Point A: Near 'Am Al-Kundam' exit on Airport Road
        const pointA = [31.8680, 35.8820]; 
        // Point B: Near 'Al-Qastal' / Highway 15 intersection
        const pointB = [31.7820, 35.9320];

        // Initialize Map
        const map = L.map('map', {
            zoomControl: false
        }).setView([31.8250, 35.9070], 13); // Centered between the new points

        // Add zoom control to bottom left
        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        // Standard OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            subdomains: ['a', 'b', 'c'],
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        async function fetchRealRouteGeometry() {
            try {
                // Fetch route from OSRM
                const url = `https://router.project-osrm.org/route/v1/driving/${pointA[1]},${pointA[0]};${pointB[1]},${pointB[0]}?overview=full&geometries=geojson`;
                const response = await fetch(url);
                const data = await response.json();
                
                // Convert [lng, lat] to [lat, lng]
                airportRoute = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                
                setupMapElements();
                
                // Hide loading screen and enable controls
                const loadingScreen = document.getElementById('loading-screen');
                loadingScreen.style.opacity = '0';
                setTimeout(() => loadingScreen.style.display = 'none', 500);
                
                slider.disabled = false;
                playBtn.disabled = false;
                resetBtn.disabled = false;

            } catch (error) {
                console.error("Error fetching route:", error);
                document.getElementById('loading-text').innerText = '❌ فشل الاتصال بخادم الخرائط. يرجى تحديث الصفحة.';
                document.querySelector('.spinner').style.display = 'none';
            }
        }

        function setupMapElements() {
            // Calculate distances between points
            for (let i = 0; i < airportRoute.length - 1; i++) {
                const segDist = map.distance(airportRoute[i], airportRoute[i + 1]);
                totalHighwayDistance += segDist;
                cumulativeDistances.push(totalHighwayDistance);
            }

            // Draw planned route (dashed)
            plannedPolyline = L.polyline(airportRoute, {
                color: '#64748b', weight: 6, dashArray: '8, 10', opacity: 0.7
            }).addTo(map);

            // Draw traveled route (solid, initially just start point)
            traveledPolyline = L.polyline([airportRoute[0]], {
                color: '#2563eb', weight: 7, opacity: 0.95, lineCap: 'round'
            }).addTo(map);

            // Start marker
            L.circleMarker(airportRoute[0], {
                radius: 8, fillColor: '#10b981', color: '#ffffff', weight: 3, fillOpacity: 1
            }).addTo(map).bindPopup("<b>نقطة البداية (مقطع قصير)</b>");

            // End marker
            L.circleMarker(airportRoute[airportRoute.length - 1], {
                radius: 8, fillColor: '#ef4444', color: '#ffffff', weight: 3, fillOpacity: 1
            }).addTo(map).bindPopup("<b>نقطة النهاية (مقطع قصير)</b>");

            // Car marker icon setup
            const carIcon = L.divIcon({
                html: `
                    <div class="car-marker-container">
                        <div class="car-pulse"></div>
                        <div class="car-icon-body" id="car-rotator">🚘</div>
                    </div>
                `,
                className: 'car-icon-wrapper',
                iconSize: [38, 38],
                iconAnchor: [19, 19]
            });

            // Add car marker
            carMarker = L.marker(airportRoute[0], { icon: carIcon, zIndexOffset: 2000 }).addTo(map);
            
            // Fit map to show the whole route
            map.fitBounds(plannedPolyline.getBounds(), { padding: [40, 40] });
            
            // Initial update
            updateSimulation(0);
        }

        function getPositionAtProgress(progress) {
            if (!airportRoute.length) return { position: pointA, path: [] };
            
            const targetDist = progress * totalHighwayDistance;

            for (let i = 0; i < cumulativeDistances.length - 1; i++) {
                if (targetDist >= cumulativeDistances[i] && targetDist <= cumulativeDistances[i + 1]) {
                    const segmentStart = cumulativeDistances[i];
                    const segmentEnd = cumulativeDistances[i + 1];
                    const segmentRatio = (targetDist - segmentStart) / (segmentEnd - segmentStart || 1);

                    const p1 = airportRoute[i];
                    const p2 = airportRoute[i + 1];

                    const lat = p1[0] + segmentRatio * (p2[0] - p1[0]);
                    const lng = p1[1] + segmentRatio * (p2[1] - p1[1]);

                    const pathSoFar = airportRoute.slice(0, i + 1);
                    pathSoFar.push([lat, lng]);

                    return { position: [lat, lng], path: pathSoFar };
                }
            }
            return { position: airportRoute[airportRoute.length - 1], path: airportRoute };
        }

        function updateSimulation(frame) {
            if (!airportRoute.length) return;

            const safeFrame = Math.max(0, Math.min(frame, totalFrames));
            const progress = safeFrame / totalFrames;

            const { position, path } = getPositionAtProgress(progress);

            // Update car position and trace line
            carMarker.setLatLng(position);
            traveledPolyline.setLatLngs(path);
            
            // Follow car if playing
            if (timer) {
                map.panTo(position, { animate: true, duration: 0.1 });
            }

            const distanceCovered = progress * totalHighwayDistance;
            const percent = Math.round(progress * 100);

            // Update dashboard stats
            frameVal.innerText = `${safeFrame} / ${totalFrames}`;
            percentVal.innerText = `${percent}%`;
            distVal.innerText = `${Math.round(distanceCovered).toLocaleString()} م / ${Math.round(totalHighwayDistance).toLocaleString()} م`;
        }

        // Handle slider manual input
        slider.addEventListener('input', function() {
            updateSimulation(parseInt(this.value, 10));
        });

        let timer = null;

        function togglePlay() {
            if (timer) {
                // Pause
                clearInterval(timer);
                timer = null;
                playIcon.innerText = "▶️";
                playText.innerText = "تشغيل المحاكاة";
                playBtn.style.background = "linear-gradient(135deg, #2563eb, #1d4ed8)";
            } else {
                // Play
                playIcon.innerText = "⏸️";
                playText.innerText = "إيقاف مؤقت";
                playBtn.style.background = "linear-gradient(135deg, #d97706, #b45309)";

                timer = setInterval(() => {
                    let cur = parseInt(slider.value, 10);
                    if (cur >= totalFrames) {
                        cur = 0; // Restart if at end
                    } else {
                        cur = Math.min(totalFrames, cur + 3); // Advance frames
                    }
                    slider.value = cur;
                    updateSimulation(cur);

                    // Auto pause at end
                    if (cur >= totalFrames) {
                        togglePlay();
                    }
                }, 40);
            }
        }

        playBtn.addEventListener('click', togglePlay);

        resetBtn.addEventListener('click', () => {
            if (timer) togglePlay();
            slider.value = 0;
            updateSimulation(0);
            if (plannedPolyline) {
                map.fitBounds(plannedPolyline.getBounds(), { padding: [40, 40] });
            }
        });

        async function loadBackendPotholes() {
            try {
                const response = await fetch('/api/potholes');
                if (!response.ok) throw new Error('Network response was not ok');
                const result = await response.json();
                
                if (result.success && Array.isArray(result.data)) {
                    potholeCountEl.innerText = `${result.data.length} عوائق`;
                    renderPotholeMarkers(result.data);
                }
            } catch (err) {
                console.warn('Backend API not reachable directly, using realistic simulated potholes for the short segment:', err);
                // Adjusted dummy data to fall within the new shorter segment
                const fallbackPotholes = [
                    {
                        id: "ANO-3426-456",
                        address: "شارع المطار، بعد تقاطع أم العمد",
                        lat: 31.8350,
                        lng: 35.9010,
                        severity: "Severe",
                        incidentType: "Pothole",
                        status: "Ongoing",
                        comments: ["فحص بواسطة كاميرا الرصد - عمق 12 سم"]
                    },
                    {
                        id: "ANO-3426-457",
                        address: "شارع المطار، قبل القسطل",
                        lat: 31.8020,
                        lng: 35.9200,
                        severity: "Moderate",
                        incidentType: "Road Crack",
                        status: "In Progress",
                        comments: ["تشققات طولية في المسرب الأيمن"]
                    }
                ];
                potholeCountEl.innerText = `${fallbackPotholes.length} عوائق`;
                renderPotholeMarkers(fallbackPotholes);
            }
        }

        function renderPotholeMarkers(items) {
            items.forEach(item => {
                const potholeIcon = L.divIcon({
                    html: '<div class="pothole-icon-wrapper">⚠️</div>',
                    className: 'custom-pothole-icon',
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });

                const marker = L.marker([item.lat, item.lng], { icon: potholeIcon }).addTo(map);

                marker.bindPopup(`
                    <div class="popup-card">
                        <span class="popup-badge">${item.severity === 'Severe' ? 'خطورة عالية' : 'متوسط'}</span>
                        <div class="popup-title">${item.incidentType || 'حفرة طريق'} - ${item.id}</div>
                        <div class="popup-desc">📍 ${item.address}</div>
                        <div class="popup-desc">الحالة: <b>${item.status}</b></div>
                        ${item.comments && item.comments.length ? `<div style="font-size: 0.75rem; color:#475569;">💬 ${item.comments[0]}</div>` : ''}
                    </div>
                `);
            });
        }

        // Start initialization on load
        fetchRealRouteGeometry();
        loadBackendPotholes();
    </script>
</body>
</html>
